volumes:
  ckan_storage:
  pg_data:
  solr_data:
  pip_cache:
  site_packages:
  local_bin:
  home_dir:

services:

  ckan-dev:
    platform: linux/amd64
    build:
      context: ckan/
      dockerfile: Dockerfile.dev
      args:
        - TZ=${TZ}
    env_file:
      - .env
    links:
      - db
      - solr
      - redis
    ports:
      - "0.0.0.0:${CKAN_PORT_HOST}:5000"
    volumes:
      - ckan_storage:/var/lib/ckan
      - ./src:/srv/app/src_extensions
      - pip_cache:/root/.cache/pip
      - site_packages:/usr/local/lib/python3.10/site-packages
      - local_bin:/usr/local/bin
      - home_dir:/srv/app/
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:5000"]
      interval: 60s
      timeout: 10s
      retries: 3

  docs:
    image: oven/bun:1.2-alpine
    command: >
      sh -c "apk add --no-cache git &&
        if [ -d /ckanaction-pnaig/.git ]; then
          git -C /ckanaction-pnaig fetch --depth 1 origin development &&
          git -C /ckanaction-pnaig checkout -B development origin/development;
        else
          rm -rf /ckanaction-pnaig &&
          git clone --depth 1 --branch development https://github.com/otic08/ckanaction-pnaig.git /ckanaction-pnaig;
        fi &&
        cd /ckanaction-pnaig/docs &&
        bun install --frozen-lockfile &&
        bun dev --hostname 0.0.0.0 --port 3000"
    environment:
      - NEXT_TELEMETRY_DISABLED=1
    ports:
      - "0.0.0.0:${DOCS_PORT_HOST:-3000}:3000"
    depends_on:
      ckan-dev:
        condition: service_healthy
    restart: unless-stopped

  datapusher:
    image: ckan/ckan-base-datapusher:${DATAPUSHER_VERSION}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:8800"]
      interval: 60s
      timeout: 10s
      retries: 3

  db:
    build:
      context: postgresql/
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
      - CKAN_DB_USER
      - CKAN_DB_PASSWORD
      - CKAN_DB
      - DATASTORE_READONLY_USER
      - DATASTORE_READONLY_PASSWORD
      - DATASTORE_DB
    ports:
      - "0.0.0.0:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
     
  solr:
    image: ckan/ckan-solr:${SOLR_IMAGE_VERSION}
    volumes:
      - solr_data:/var/solr
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:8983/solr/"]

  email-worker:
    platform: linux/amd64
    build:
      context: ckan/
      dockerfile: Dockerfile.dev
      args:
        - TZ=${TZ}
    env_file:
      - .env
    entrypoint: ["ckan", "-c", "/srv/app/ckan.ini", "jobs", "worker", "pnaig-emailer"]
    links:
      - db
      - solr
      - redis
    volumes:
      - ckan_storage:/var/lib/ckan
      - ./src:/srv/app/src_extensions
      - pip_cache:/root/.cache/pip
      - site_packages:/usr/local/lib/python3.10/site-packages
      - local_bin:/usr/local/bin
      - home_dir:/srv/app/
    depends_on:
      ckan-dev:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:${REDIS_VERSION}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-e", "QUIT"]
